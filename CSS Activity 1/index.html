<!DOCTYPE html>
<html>

<head>
    <title>Three Methods of Adding CSS</title>

    <style>
        .red{
            color: red;
        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Three Methods of Adding CSS</h1>
    
    <h1 style="color: blue;">Style Me in Blue!</h1>

    <h1 class="red">Style Me in Red!</h1>

    <h1 class="green">Style Me in Green!</h1>

</body>

</html>
